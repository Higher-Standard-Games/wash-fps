<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile viewport with zoom disabled for game controls -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA / Mobile App meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SHAG Engine" />

    <!-- Prevent phone number detection on iOS -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#1a1a2e" />

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Link previews (chat apps, social sites). og:image must be absolute: the site's card, served from washoi.net for every region. -->
    <meta name="description" content="Washiki Washoi! is a fast arena shooter in the browser: Duel, Amphi, FFA and Search &amp; Destroy. Strafe-jump, time the armors, frag." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Washiki Washoi!" />
    <meta property="og:title" content="Washiki Washoi!" />
    <meta property="og:description" content="A fast arena shooter in the browser: Duel, Amphi, FFA and Search &amp; Destroy." />
    <meta property="og:image" content="https://washoi.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Washiki Washoi! Arcade-speed movement shooter, free to play." />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Washiki Washoi!</title>
  </head>
